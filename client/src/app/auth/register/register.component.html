<div class="container" style="max-width: 420px; margin-top: 60px;">
  <h2 class="mb-4">Kayıt Ol</h2>

  <form [formGroup]="registerForm" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Ad Soyad</label>
      <input type="text" class="form-control" formControlName="fullName" />
    </div>

    <div class="mb-3">
      <label class="form-label">E-posta</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>

    <div class="mb-3">
      <label class="form-label">Telefon (opsiyonel)</label>
      <input type="tel" class="form-control" formControlName="phoneNumber" />
    </div>

    <div class="mb-3">
      <label class="form-label">Şifre</label>
      <input type="password" class="form-control" formControlName="password" />
      <div class="form-text">En az 8 karakter</div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
      Kayıt Ol
    </button>
  </form>

  <p class="mt-3 text-center">
    Zaten hesabın var mı? <a routerLink="/login">Giriş yap</a>
  </p>
</div>
